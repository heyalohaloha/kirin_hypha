name: AAX Phase A

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Licensed SDK builds run locally or in the separate trusted release factory.
# Public contributors use the hosted, credential-free absence gate below.
jobs:
  sdk-absence:
    name: licensed AAX SDK absence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Test and enforce SDK absence
        run: |
          node scripts/test_aax_cmake_gate.mjs
          node scripts/test_build_aax_universal.mjs
          node --test scripts/check_aax_sdk_absence.test.mjs
          node --test scripts/ls_release/aax_distribution.test.mjs
          node --test scripts/ls_release/aax_submission_archive.test.mjs
          node scripts/check_aax_sdk_absence.mjs
