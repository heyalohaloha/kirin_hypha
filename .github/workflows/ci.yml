name: CI
on:
  workflow_dispatch:
    inputs:
      update_public_key:
        description: Approved public RSA key (empty disables checking)
        default: ""
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Public validation stays read-only and never receives signing credentials.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The full product contract also builds the common processor. Bound native build
  # concurrency on each runner; timing-sensitive tests continue to run serially.
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  CARGO_BUILD_JOBS: "2"
  KIRIN_HYPHA_UPDATE_PUBLIC_KEY_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.update_public_key || '' }}

jobs:
  public-history:
    name: public history identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tag reachability and duplicate-label checks require the complete
          # candidate-main history on every event, including ordinary main pushes.
          fetch-depth: 0

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Resolve source line comparison commit
        env:
          SOURCE_LINE_BUDGET_EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          if [[ "$SOURCE_LINE_BUDGET_EVENT_BASE" =~ ^0+$ ]]; then
            SOURCE_LINE_BUDGET_EVENT_BASE=HEAD^
          fi
          echo "SOURCE_LINE_BUDGET_BASE_REF=$SOURCE_LINE_BUDGET_EVENT_BASE" >> "$GITHUB_ENV"

      - name: Test public CI security boundary
        run: node --test scripts/ci_security.test.mjs

      - name: Test lightweight source contract
        run: bash scripts/test_lightweight_contract.sh

      - name: Test public history contract
        run: |
          node --test scripts/public_history.test.mjs
          node scripts/check_public_history.mjs --tip HEAD

  release-source:
    name: release source ${{ matrix.phase }} (macos)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[ci full]') }}
    runs-on: macos-15
    # Independent jobs; every native shard builds the identical graph before its selection.
    # Hosted macOS measurements: native build 21-22 min; serial tests projected at 80-110
    # min before notification waits. The observed test durations put at most 33% in one
    # of four stride shards (42% with three). Budget 22 build + 37 tests + 16 setup,
    # variance/cache-save = 75 min each (tests estimated from 110 * .33, no speedup assumed).
    # Three shards would need ~46 min of tests per job. Keep checks 15+10, Rust 20+10,
    # ignored FFI 20+10 min estimates until the next authorized hosted measurements.
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: checks
            minutes: 25
          - phase: rust
            minutes: 30
          - phase: ffi
            minutes: 30
          - phase: native1
            minutes: 75
          - phase: native2
            minutes: 75
          - phase: native3
            minutes: 75
          - phase: native4
            minutes: 75
    timeout-minutes: ${{ matrix.minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Release provenance and release_state history guards inspect tags and
          # public branch history, so the source-contract job needs full history.
          fetch-depth: 0
          # The source contract builds the PRE display runtime test against the
          # pinned JUCE tree. A clean runner must not depend on a locally-present
          # submodule checkout.
          submodules: recursive

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-source-${{ matrix.phase }}

      - name: Test shipping source contract
        env:
          RELEASE_SOURCE_PHASE: ${{ matrix.phase }}
        run: bash scripts/test_release_source.sh --phase "$RELEASE_SOURCE_PHASE"

  test:
    # Preserve the protected check name and release provenance consumer. A skipped,
    # cancelled or failed shard must fail this aggregate, never look green.
    name: release source contract (macos)
    needs: [release-source]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[ci full]')) }}
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Require every release source phase
        env:
          RELEASE_SOURCE_RESULT: ${{ needs.release-source.result }}
        run: test "$RELEASE_SOURCE_RESULT" = success

  auval-arm64:
    name: auval arm64 (AU validation)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[ci full]') }}
    # macos-15 is an Apple Silicon (arm64) runner: builds arm64-native and validates the AU on
    # the same arch the ship universal binary's arm64 slice runs on (B-082/B-084). engine
    # (kirin_measure) calculation is unchanged -- this is CI / packaging validation only.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive # JUCE is a pinned submodule (juce_shell/JUCE)

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # arm64-native: macos-15 host is aarch64, so `cargo build` produces the arm64 staticlib at
      # target/release (the CMake KIRIN_FFI_LIB default path).
      - name: Build kirin_hypha_ffi staticlib (arm64 native)
        run: cargo build --release -p kirin_hypha_ffi --locked

      # The JUCE submodule is pinned pristine; local patches are applied at build time only.
      # Keep CI and scripts/build_juce_universal.sh on the same patch flags.
      - name: Apply tracked JUCE patch stack
        run: bash scripts/apply_juce_patches.sh

      - name: Build macOS common-shell AU + VST3 bundles (arm64)
        run: |
          cmake -S juce_shell -B juce_shell/build-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DKIRIN_HYPHA_BUILD_AUDIO_TRANSPARENCY_TESTS=ON
          cmake --build juce_shell/build-arm64 --config Release

      - name: Validate Kirin OS Reference preview renderer (arm64)
        run: ctest --test-dir juce_shell/build-arm64 -C Release --output-on-failure -R '^kirin_hypha_reference_preview_renderer$'

      # Recreate and validate the exact role-first installed VST3 layout before any
      # Studio One/manual loop. auval below validates the other format from the same source.
      - name: Validate macOS ship-set VST3 with pluginval
        env:
          PLUGINVAL_SKIP_GUI_TESTS: "1"
        run: scripts/validate_macos_pluginval.sh juce_shell/build-arm64

      - name: Upload macOS pluginval logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kirin-hypha-macos-pluginval-logs
          path: target/pluginval/logs/macos
          if-no-files-found: ignore

      - name: Install AU components + re-register
        run: |
          DST="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$DST"
          for r in PRE POST; do
            rm -rf "$DST/Kirin Hypha $r.component"
            cp -R "juce_shell/build-arm64/KirinHypha${r}_artefacts/Release/AU/Kirin Hypha $r.component" "$DST/"
          done
          lipo -info "$DST/Kirin Hypha PRE.component/Contents/MacOS/Kirin Hypha PRE"
          # Force AudioComponentRegistrar to rescan the freshly-copied components.
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 8

      # JUCE resolves AU instances through AudioComponentFindNext even when given a bundle
      # path. Register this build before the host test so a clean runner can discover it.
      - name: Validate macOS AU and VST3 audio transparency
        run: |
          TEST_EXE="$(find juce_shell/build-arm64 -type f -name KirinAudioTransparencyContractTests -perm +111 | head -1)"
          test -n "$TEST_EXE"
          "$TEST_EXE" \
            "juce_shell/build-arm64/KirinHyphaPRE_artefacts/Release/VST3/Kirin Hypha PRE.vst3" \
            "juce_shell/build-arm64/KirinHyphaPOST_artefacts/Release/VST3/Kirin Hypha POST.vst3" \
            "juce_shell/build-arm64/KirinHyphaPRE_artefacts/Release/AU/Kirin Hypha PRE.component" \
            "juce_shell/build-arm64/KirinHyphaPOST_artefacts/Release/AU/Kirin Hypha POST.component"

      # Individual auval per AU (NOT `auval -a`: that scans every AU on the system and can crash
      # on unrelated third-party AUs, e.g. iZotope). Gate on "AU VALIDATION SUCCEEDED".
      - name: auval PRE (aufx Khpr Kirn)
        run: |
          auval -v aufx Khpr Kirn | tee /tmp/auval-pre.log
          grep -q "AU VALIDATION SUCCEEDED" /tmp/auval-pre.log

      - name: auval POST (aufx Khpo Kirn)
        run: |
          auval -v aufx Khpo Kirn | tee /tmp/auval-post.log
          grep -q "AU VALIDATION SUCCEEDED" /tmp/auval-post.log

  windows-vst3-preflight:
    name: windows VST3 preflight
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[ci full]') }}
    runs-on: windows-latest
    env:
      HYPHA_WINDOWS_BUILD_DIR: D:/kh
    # Measured local cold build at 4 CPUs: 33.2 min; serial tests: 16.3 min.
    # Estimate 34 build + 17 tests + 9 verification/packaging + 15 setup/runner/cache margin
    # = 75 min; the last measured hosted run took 64 min. The pre-build installer check and
    # the previous-release upgrade phase add about 8 min, so the budget is 90 min. Hosted
    # runtime must be checked on the next authorized run; no deadline or matrix coverage is
    # relaxed by this job budget.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive # JUCE is required for the Windows VST3 shell build.

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install verified Inno Setup compiler
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadDir = Join-Path $env:RUNNER_TEMP 'inno-download'
          $installDir = Join-Path $env:RUNNER_TEMP 'Inno Setup 6'
          $installLog = Join-Path $env:RUNNER_TEMP 'inno-setup-install.log'
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          Push-Location $downloadDir
          try {
            gh release download is-6_7_3 --repo jrsoftware/issrc --pattern 'innosetup-6.7.3.exe'
            gh release verify-asset is-6_7_3 'innosetup-6.7.3.exe' --repo jrsoftware/issrc
            $installer = Join-Path $downloadDir 'innosetup-6.7.3.exe'
            $arguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /PORTABLE=1 /DIR=`"$installDir`" /LOG=`"$installLog`""
            $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Inno Setup install failed with exit $($process.ExitCode)" }
          } finally {
            Pop-Location
          }
          $iscc = Join-Path $installDir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            if (Test-Path -LiteralPath $installLog -PathType Leaf) { Get-Content -LiteralPath $installLog }
            throw 'verified ISCC.exe not found'
          }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Installer scripts and the Inno recipe fail here in minutes, before the native build.
      - name: Check Windows installer scripts, signature records and recipe
        shell: pwsh
        run: pwsh -NoProfile -File scripts/windows/check_installer_sources.ps1

      # Windows remains VST3-only. AU, Apple signing, notarization, and macOS LS packaging stay
      # on macOS. Public CI produces only unsigned candidates; release signing is isolated.
      - name: Build kirin_hypha_ffi staticlib (MSVC)
        id: ffi-build
        run: cargo build --release -p kirin_hypha_ffi --locked

      - name: Validate two-slot continuous Analysis contract
        if: ${{ !cancelled() && steps.ffi-build.outcome == 'success' }}
        run: |
          cargo test -p kirin_measure --locked exactly_two_post_analysis_runtimes_are_active_per_process_lease
          cargo test -p kirin_measure --locked absolute_mode_
          cargo test -p kirin_measure --locked post_absolute_timeline_needs_no_pair
          cargo test -p kirin_measure --locked perceptual_pair_arms_one_future_epoch_and_joins_only_continuous_state
          cargo test -p kirin_measure --locked --test perceptual_delta_mosqito_golden

      - name: Windows preflight gate
        if: ${{ !cancelled() && steps.ffi-build.outcome == 'success' }}
        run: cargo run -p xtask --locked -- windows-preflight

      - name: Apply tracked JUCE patches
        id: juce-patch
        if: ${{ !cancelled() && steps.ffi-build.outcome == 'success' }}
        shell: bash
        run: bash scripts/apply_juce_patches.sh

      - name: Prepare isolated short Windows build directory
        id: native-root
        if: ${{ !cancelled() && steps.juce-patch.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildRoot = $env:HYPHA_WINDOWS_BUILD_DIR
          if (Test-Path -LiteralPath $buildRoot) { throw 'Short native build root already exists; preserve it for inspection' }
          New-Item -ItemType Directory -Path $buildRoot | Out-Null

      - name: Configure JUCE VST3 shell (Windows)
        id: native-configure
        if: ${{ !cancelled() && steps.native-root.outcome == 'success' }}
        shell: pwsh
        env:
          KIRIN_FFI_LIB_PATH: ${{ github.workspace }}\target\release\kirin_hypha_ffi.lib
        run: >
          cmake -S juce_shell -B $env:HYPHA_WINDOWS_BUILD_DIR
          -DCMAKE_BUILD_TYPE=Release
          -DKIRIN_HYPHA_BUILD_PRE_DISPLAY_TESTS=ON
          -DKIRIN_HYPHA_BUILD_UI_RENDER_TESTS=ON
          -DKIRIN_HYPHA_BUILD_AUDIO_TRANSPARENCY_TESTS=ON
          -DKIRIN_HYPHA_BUILD_REFERENCE_AUDITION_TESTS=ON
          -DKIRIN_HYPHA_BUILD_UPDATE_TESTS=ON
          -DKIRIN_FFI_LIB="$env:KIRIN_FFI_LIB_PATH"

      - name: Check Windows native build inventory
        id: native-inventory
        if: ${{ !cancelled() && steps.native-configure.outcome == 'success' }}
        run: >
          node scripts/check_native_build_targets.mjs
          --build-dir $env:HYPHA_WINDOWS_BUILD_DIR --config Release --targets
          KirinUpdate_manifest_Tests KirinUpdate_store_Tests KirinUpdate_checker_Tests KirinUpdate_http_response_Tests
          KirinUpdateRuntimeIntegrationTests KirinUiRenderContractTests KirinHostIdentityTests KirinSnapshotAbiContractTests
          KirinAttackUiContractTests KirinHyphaReferencePreviewRenderer KirinLocalBlindCaptureTests KirinLocalBlindCaptureServiceTests
          KirinLocalBlindCapturePairComparisonTests KirinLocalBlindPdcValidationDelayTests KirinLocalBlindTrialTests KirinLocalBlindPreparationTests
          KirinLocalBlindHostContextTests KirinLocalBlindProductTests KirinEditorSurfaceProductTests KirinLiveCompareCorrespondenceTests
          KirinLiveCompareTimingTests KirinLiveCompareSessionTests KirinLiveCompareMatchTests KirinLiveCompareLoopTests
          KirinLiveCompareLoopFeasibilityTests KirinLiveCompare_reentry_Tests KirinLiveCompare_gain_snapshot_Tests Kirin_live_blind_session_Tests
          Kirin_live_compare_completion_Tests Kirin_live_compare_authority_Tests Kirin_reaper_clock_Tests Kirin_reaper_correspondence_Tests
          Kirin_reaper_fault_Tests KirinReaperListenProductTests KirinChainTraceTests KirinListenTextLayoutTests
          KirinHostContentClockPolicyTests KirinLiveComparePinProductTests KirinLiveCompareOffsetProductTests KirinLiveCompareAaxGroupProductTests
          KirinLiveTimingProductTests KirinLiveBlindProductTests KirinLiveRecoveryProductTests KirinLiveCompareLifecycleTests
          KirinLiveChainTimingProductTests KirinLiveReentryProductTests KirinCaptureWorkAttachmentTests KirinReferenceAuditionRuntimeTests
          KirinReferenceAudioPagesTests KirinReferenceAudioStreamingTests KirinReferenceContentCorrelationTests KirinOutputOwnershipTests
          KirinPairPreviewLifetimeTests KirinAudioTransparencyContractTests
          KirinLivePublicationPRETests KirinLivePublicationPOSTTests

      - name: Build JUCE VST3 shell (Windows)
        id: native-build
        if: ${{ !cancelled() && steps.native-inventory.outcome == 'success' }}
        shell: pwsh
        run: >
          cmake --build $env:HYPHA_WINDOWS_BUILD_DIR --config Release
          --target KirinWindowsPreflight
          --parallel $env:NUMBER_OF_PROCESSORS

      - name: Validate Windows publication and duplicate identity
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          ctest --test-dir $env:HYPHA_WINDOWS_BUILD_DIR -C Release --output-on-failure --no-tests=error -R '^kirin_live_publication_(PRE|POST)_(state-only|shared-ring|storage-only|duplicate)$'

      - name: Validate Windows offline update services
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          ctest --test-dir $env:HYPHA_WINDOWS_BUILD_DIR -C Release --output-on-failure --no-tests=error -R '^kirin_update_((manifest|store|checker|http_response)$|runtime_)'

      - name: Validate Windows UI render contract
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          ctest --test-dir $env:HYPHA_WINDOWS_BUILD_DIR -C Release --output-on-failure -R '^(kirin_ui_render_contract|kirin_host_identity|kirin_snapshot_abi_contract)$'

      # The DRUM (TIME > ATTACK) surface is rendered by the Windows JUCE graphics stack as well, and
      # its previews are kept so the Windows screen can be inspected for every change.
      - name: Validate Windows DRUM UI contract
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        shell: pwsh
        env:
          KIRIN_ATTACK_UI_PREVIEW_PATH: ${{ github.workspace }}\drum-ui-preview\preview.png
          KIRIN_ATTACK_UI_LANES_PREVIEW_PATH: ${{ github.workspace }}\drum-ui-preview\lanes.png
          KIRIN_ATTACK_UI_LOUPE_PREVIEW_PATH: ${{ github.workspace }}\drum-ui-preview\loupe.png
          KIRIN_ATTACK_UI_HEAD_ONLY_PREVIEW_PATH: ${{ github.workspace }}\drum-ui-preview\head_only.png
          KIRIN_ATTACK_UI_COMPACT_PREVIEW_PATH: ${{ github.workspace }}\drum-ui-preview\compact.png
          KIRIN_ATTACK_UI_SELECTION_PREVIEW_PATH: ${{ github.workspace }}\drum-ui-preview\selection.png
          KIRIN_ATTACK_UI_POST_ONLY_PREVIEW_PATH: ${{ github.workspace }}\drum-ui-preview\post_only.png
          KIRIN_ATTACK_UI_OVERLAY_PREVIEW_PATH: ${{ github.workspace }}\drum-ui-preview\overlay.png
          KIRIN_ATTACK_UI_LOCK_PREVIEW_PATH: ${{ github.workspace }}\drum-ui-preview\lock.png
          KIRIN_ATTACK_UI_IDENTITY_PREVIEW_PATH: ${{ github.workspace }}\drum-ui-preview\identity.png
        run: |
          New-Item -ItemType Directory -Force -Path drum-ui-preview | Out-Null
          ctest --test-dir $env:HYPHA_WINDOWS_BUILD_DIR -C Release --output-on-failure -R '^kirin_attack_ui_contract$'

      - name: Check embedded material distribution permissions
        id: provenance-assets
        run: node scripts/provenance/asset_gate.mjs --github-output

      # Preview permission is separate from actual binary/source delivery qualification.
      - name: Upload Windows DRUM UI previews
        if: ${{ always() && steps.provenance-assets.outputs.preview-approved == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kirin-hypha-windows-drum-ui
          path: drum-ui-preview/*.png
          if-no-files-found: warn

      - name: Validate Kirin OS Reference preview renderer (Windows)
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          ctest --test-dir $env:HYPHA_WINDOWS_BUILD_DIR -C Release --output-on-failure -R '^kirin_hypha_reference_preview_renderer$'

      - name: Validate local PRE/POST Blind and complete product flow
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          ctest --test-dir $env:HYPHA_WINDOWS_BUILD_DIR -C Release --output-on-failure --no-tests=error -R '^(kirin_local_blind_.*|kirin_editor_surface_product)$'

      - name: Validate live PRE/POST compare correspondence
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          ctest --test-dir $env:HYPHA_WINDOWS_BUILD_DIR -C Release --output-on-failure --no-tests=error -R '^(kirin_live_compare_(correspondence|timing|session|match|loop|loop_feasibility|completion|authority|reentry|gain_snapshot)|kirin_live_blind_session)$'

      - name: Validate REAPER LISTEN contracts and product flow
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          ctest --test-dir $env:HYPHA_WINDOWS_BUILD_DIR -C Release --output-on-failure --no-tests=error -R '^(kirin_reaper_clock|kirin_reaper_correspondence|kirin_reaper_fault|kirin_reaper_listen_mono_product|kirin_reaper_listen_stereo_product|kirin_chain_trace|kirin_listen_text_layout|kirin_host_content_clock_policy)$'

      # The Windows live ring end to end: the real PRE and POST processors, pair discovery, the
      # named section, the product editor, PIN to Blind and the offset warning.
      # They run in real time, so a stall of the shared runner can fail one by chance: each runs once
      # more on failure, and failing twice fails. kirin_live_blind_loop_stall_product tests a stall on purpose.
      - name: Validate live PRE/POST compare product flow
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          ctest --test-dir $env:HYPHA_WINDOWS_BUILD_DIR -C Release --output-on-failure --no-tests=error --repeat until-pass:2 -R '^kirin_live_.*(product|restore-active|restore-invalid|restore-preparing|restore-approval|held|finishing|out-of-range|reuse-held|restore-matched-listen)$'

      - name: Validate Work attachment transport
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          ctest --test-dir $env:HYPHA_WINDOWS_BUILD_DIR -C Release --output-on-failure --no-tests=error -R '^kirin_capture_work_attachment$'

      - name: Validate Reference audition session contract
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          ctest --test-dir $env:HYPHA_WINDOWS_BUILD_DIR -C Release --output-on-failure --no-tests=error -R '^(kirin_reference_audition_runtime|kirin_reference_audio_pages|kirin_reference_audio_streaming|kirin_reference_content_correlation|kirin_output_ownership|kirin_pair_preview_lifetime)$'

      - name: Validate Windows VST3 audio transparency
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-ChildItem -Path $env:HYPHA_WINDOWS_BUILD_DIR -Recurse -File -Filter 'KirinAudioTransparencyContractTests.exe' | Select-Object -First 1).FullName
          if (-not $exe) { throw 'audio transparency contract executable not found' }
          $bundles = @(Get-ChildItem -Path $env:HYPHA_WINDOWS_BUILD_DIR -Recurse -Directory -Filter *.vst3 | Sort-Object FullName)
          if ($bundles.Count -ne 2) { throw "expected exactly 2 VST3 bundles, found $($bundles.Count)" }
          & $exe $bundles[0].FullName $bundles[1].FullName
          if ($LASTEXITCODE -ne 0) { throw "audio transparency contract failed with exit code $LASTEXITCODE" }

      - name: Verify Windows VST3 artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifacts = @(
            @{
              Bundle = "$env:HYPHA_WINDOWS_BUILD_DIR/KirinHyphaPRE_artefacts/Release/VST3/Kirin Hypha PRE.vst3"
              Binary = "$env:HYPHA_WINDOWS_BUILD_DIR/KirinHyphaPRE_artefacts/Release/VST3/Kirin Hypha PRE.vst3/Contents/x86_64-win/Kirin Hypha PRE.vst3"
            },
            @{
              Bundle = "$env:HYPHA_WINDOWS_BUILD_DIR/KirinHyphaPOST_artefacts/Release/VST3/Kirin Hypha POST.vst3"
              Binary = "$env:HYPHA_WINDOWS_BUILD_DIR/KirinHyphaPOST_artefacts/Release/VST3/Kirin Hypha POST.vst3/Contents/x86_64-win/Kirin Hypha POST.vst3"
            }
          )
          foreach ($artifact in $artifacts) {
            $bundle = $artifact.Bundle
            $binary = $artifact.Binary
            if (-not (Test-Path -LiteralPath $bundle)) {
              throw "missing Windows VST3 bundle: $bundle"
            }
            if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
              throw "missing Windows VST3 binary: $binary"
            }
            $binaryInfo = Get-Item -LiteralPath $binary
            if ($binaryInfo.Length -le 0) {
              throw "empty Windows VST3 binary: $binary"
            }
            Get-ChildItem -LiteralPath $bundle -Recurse | Select-Object -First 20 FullName,Length
          }

      # Diagnostic binaries remain held pending reviewed actual delivery evidence.
      - name: Upload Windows VST3 artifacts
        if: ${{ steps.provenance-assets.outputs.binary-approved == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kirin-hypha-windows-vst3
          path: |
            ${{ env.HYPHA_WINDOWS_BUILD_DIR }}/KirinHyphaPRE_artefacts/Release/VST3/Kirin Hypha PRE.vst3
            ${{ env.HYPHA_WINDOWS_BUILD_DIR }}/KirinHyphaPOST_artefacts/Release/VST3/Kirin Hypha POST.vst3
          if-no-files-found: error

      # B-198: load-validate the built VST3 with Tracktion pluginval (headless). Runs after the
      # gated upload step; binary publication remains held pending distribution evidence. This is the first step
      # that actually instantiates the plugin (the build/Verify steps only prove link + file presence).
      # VST3 bundles are discovered dynamically (not hardcoded) to avoid duplicating the literal
      # artifact path strings: windows-preflight's negative test replaces the POST path in the Upload
      # block and expects the audit to fail, so the path must appear only there. (Note: that audit's
      # section_after scan is unbounded and does NOT itself enforce uniqueness — see windows_preflight.rs.)
      - name: Validate Windows VST3 with pluginval
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Tracktion pluginval v1.0.4 official Windows CLI binary.
          $url = 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip'
          Invoke-WebRequest -Uri $url -OutFile pluginval_Windows.zip
          Expand-Archive -LiteralPath pluginval_Windows.zip -DestinationPath pluginval_bin -Force
          $exe = (Get-ChildItem -Path pluginval_bin -Recurse -Filter pluginval.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw 'pluginval.exe not found in pluginval_Windows.zip' }
          $bundles = @(Get-ChildItem -Path $env:HYPHA_WINDOWS_BUILD_DIR -Recurse -Directory -Filter *.vst3)
          if ($bundles.Count -ne 2) { throw "expected exactly 2 VST3 bundles, found $($bundles.Count)" }
          foreach ($b in $bundles) {
            Write-Host "pluginval --strictness-level 5 $($b.FullName)"
            # pluginval.exe is a GUI-subsystem app: `& $exe` neither waits for it nor populates
            # $LASTEXITCODE, so the exit code must be read via Start-Process -Wait -PassThru (B-200).
            # The bundle path contains spaces ("Kirin Hypha POST.vst3"); -ArgumentList does not
            # auto-quote, so the path MUST be wrapped in embedded double quotes or it is split (B-201).
            $proc = Start-Process -FilePath $exe -ArgumentList "--strictness-level 5 `"$($b.FullName)`"" -NoNewWindow -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "pluginval failed for $($b.FullName) (exit $($proc.ExitCode))" }
          }

      # Legacy provenance identifier retained for existing artifact consumers.
      # Execution is always unsigned; release signing uses the independent trusted factory.
      - name: Build Windows installer and sign all executable surfaces
        shell: pwsh
        env:
          WINDOWS_SIGNING: unsigned
          WINDOWS_EXTERNAL_VALIDATION: pending
        run: >
          node scripts/windows/build-installer.mjs
          --artifact-dir $env:HYPHA_WINDOWS_BUILD_DIR
          --output-dir dist/WINDOWS_CI
          --signing $env:WINDOWS_SIGNING
          --external-validation $env:WINDOWS_EXTERNAL_VALIDATION
          --update-public-key "$env:KIRIN_HYPHA_UPDATE_PUBLIC_KEY_INPUT"

      # Exact pinned bytes of the earlier public installers; the upgrade phase keeps them in
      # the scopes users installed them in.
      - name: Download pinned previous public Windows installers
        shell: pwsh
        run: pwsh -NoProfile -File scripts/windows/download_previous_installers.ps1 -OutDir "$env:RUNNER_TEMP/hypha-previous-installers"

      - name: Verify Windows installer install, same-version reinstall, signatures, and uninstall
        shell: pwsh
        env:
          WINDOWS_SIGNING: unsigned
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem -LiteralPath dist/WINDOWS_CI -File -Filter 'Kirin-Hypha-*-Windows-x64-Setup.exe')
          if ($installer.Count -ne 1) { throw "expected one installer, found $($installer.Count)" }
          pwsh -NoProfile -File scripts/windows/verify-installer.ps1 `
            -Installer $installer[0].FullName `
            -PayloadDir dist/WINDOWS_CI/installer-payload `
            -Signing $env:WINDOWS_SIGNING `
            -Manifest "$($installer[0].FullName).json" `
            -PreviousInstallerDir "$env:RUNNER_TEMP/hypha-previous-installers"
          if ($LASTEXITCODE -ne 0) { throw "installer lifecycle or upgrade verification failed: $LASTEXITCODE" }

      # Diagnostic binaries remain held pending reviewed actual delivery evidence.
      - name: Upload primary Windows installer
        if: ${{ steps.provenance-assets.outputs.binary-approved == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kirin-hypha-windows-installer
          path: |
            dist/WINDOWS_CI/Kirin-Hypha-*-Windows-x64-Setup.exe
            dist/WINDOWS_CI/Kirin-Hypha-*-Windows-x64-Setup.exe.sha256
            dist/WINDOWS_CI/Kirin-Hypha-*-Windows-x64-Setup.exe.json
          if-no-files-found: error

      - name: Package fallback Windows VST3 ZIP
        shell: pwsh
        env:
          WINDOWS_SIGNING: unsigned
        run: >
          node scripts/ls_release/build_kirin_hypha_windows_vst3_zip.mjs
          --artifact-dir dist/WINDOWS_CI/installer-payload
          --output-dir dist/WINDOWS_CI
          --release-kind ci
          --external-validation pending
          --payload-signing $env:WINDOWS_SIGNING

      # Diagnostic binaries remain held pending reviewed actual delivery evidence.
      - name: Upload fallback Windows VST3 ZIP
        if: ${{ steps.provenance-assets.outputs.binary-approved == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kirin-hypha-windows-vst3-ls-package
          path: |
            dist/WINDOWS_CI/Kirin-Hypha-*-Windows-VST3-*.zip
            dist/WINDOWS_CI/Kirin-Hypha-*-Windows-VST3-*.zip.sha256
            dist/WINDOWS_CI/Kirin-Hypha-*-Windows-VST3-*.zip.json
          if-no-files-found: error
