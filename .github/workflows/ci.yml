name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (macos)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[ci full]') }}
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build (tests, no run)
        run: cargo test --all --no-run --locked

      - name: cargo test
        run: cargo test --all --locked

      # if: always() so a flaky/failed `cargo test` above does not skip these gates (review 2026-06-28).
      - name: kirin_hypha_ffi ignored parity tests
        if: always()
        run: cargo test -p kirin_hypha_ffi --test parity --locked -- --ignored --test-threads=1

      - name: kirin_hypha_ffi ignored pairing tests
        if: always()
        run: cargo test -p kirin_hypha_ffi --test pairing_candidates --locked -- --ignored --test-threads=1

  auval-arm64:
    name: auval arm64 (AU validation)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[ci full]') }}
    # macos-14 is an Apple Silicon (arm64) runner: builds arm64-native and validates the AU on
    # the same arch the ship universal binary's arm64 slice runs on (B-082/B-084). engine
    # (kirin_measure) calculation is unchanged -- this is CI / packaging validation only.
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # JUCE is a pinned submodule (juce_shell/JUCE)

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # arm64-native: macos-14 host is aarch64, so `cargo build` produces the arm64 staticlib at
      # target/release (the CMake KIRIN_FFI_LIB default path).
      - name: Build kirin_hypha_ffi staticlib (arm64 native)
        run: cargo build --release -p kirin_hypha_ffi --locked

      # The JUCE submodule is pinned pristine; local patches are applied at build time only.
      # Keep CI and scripts/build_juce_universal.sh on the same patch flags.
      - name: Apply JUCE patches (patches/0001 + 0002 + 0003)
        run: bash scripts/apply_juce_patches.sh

      - name: Configure + build JUCE shells (arm64)
        run: |
          cmake -S juce_shell -B juce_shell/build-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build juce_shell/build-arm64 --config Release

      - name: Install AU components + re-register
        run: |
          DST="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$DST"
          for r in PRE POST; do
            rm -rf "$DST/Kirin Hypha $r.component"
            cp -R "juce_shell/build-arm64/KirinHypha${r}_artefacts/Release/AU/Kirin Hypha $r.component" "$DST/"
          done
          lipo -info "$DST/Kirin Hypha PRE.component/Contents/MacOS/Kirin Hypha PRE"
          # Force AudioComponentRegistrar to rescan the freshly-copied components.
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 8

      # Individual auval per AU (NOT `auval -a`: that scans every AU on the system and can crash
      # on unrelated third-party AUs, e.g. iZotope). Gate on "AU VALIDATION SUCCEEDED".
      - name: auval PRE (aufx Khpr Kirn)
        run: |
          auval -v aufx Khpr Kirn | tee /tmp/auval-pre.log
          grep -q "AU VALIDATION SUCCEEDED" /tmp/auval-pre.log

      - name: auval POST (aufx Khpo Kirn)
        run: |
          auval -v aufx Khpo Kirn | tee /tmp/auval-post.log
          grep -q "AU VALIDATION SUCCEEDED" /tmp/auval-post.log

  windows-vst3-preflight:
    name: windows VST3 preflight
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[ci full]') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # JUCE is required for the Windows VST3 shell build.

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Windows starts as VST3-only. Keep AU, codesign, notarize, and LS packaging on the macOS
      # release path so platform failures stay easy to classify.
      - name: Build kirin_hypha_ffi staticlib (MSVC)
        run: cargo build --release -p kirin_hypha_ffi --locked

      - name: Windows preflight gate
        run: cargo run -p xtask --locked -- windows-preflight

      - name: Configure JUCE VST3 shell (Windows)
        shell: pwsh
        run: >
          cmake -S juce_shell -B juce_shell/build-windows
          -DCMAKE_BUILD_TYPE=Release
          -DKIRIN_FFI_LIB="${{ github.workspace }}\target\release\kirin_hypha_ffi.lib"

      - name: Build JUCE VST3 shell (Windows)
        run: >
          cmake --build juce_shell/build-windows
          --config Release
          --target KirinHyphaPRE_VST3 KirinHyphaPOST_VST3
          --parallel 2

      - name: Verify Windows VST3 artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifacts = @(
            @{
              Bundle = "juce_shell/build-windows/KirinHyphaPRE_artefacts/Release/VST3/Kirin Hypha PRE.vst3"
              Binary = "juce_shell/build-windows/KirinHyphaPRE_artefacts/Release/VST3/Kirin Hypha PRE.vst3/Contents/x86_64-win/Kirin Hypha PRE.vst3"
            },
            @{
              Bundle = "juce_shell/build-windows/KirinHyphaPOST_artefacts/Release/VST3/Kirin Hypha POST.vst3"
              Binary = "juce_shell/build-windows/KirinHyphaPOST_artefacts/Release/VST3/Kirin Hypha POST.vst3/Contents/x86_64-win/Kirin Hypha POST.vst3"
            }
          )
          foreach ($artifact in $artifacts) {
            $bundle = $artifact.Bundle
            $binary = $artifact.Binary
            if (-not (Test-Path -LiteralPath $bundle)) {
              throw "missing Windows VST3 bundle: $bundle"
            }
            if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
              throw "missing Windows VST3 binary: $binary"
            }
            $binaryInfo = Get-Item -LiteralPath $binary
            if ($binaryInfo.Length -le 0) {
              throw "empty Windows VST3 binary: $binary"
            }
            Get-ChildItem -LiteralPath $bundle -Recurse | Select-Object -First 20 FullName,Length
          }

      - name: Upload Windows VST3 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kirin-hypha-windows-vst3
          path: |
            juce_shell/build-windows/KirinHyphaPRE_artefacts/Release/VST3/Kirin Hypha PRE.vst3
            juce_shell/build-windows/KirinHyphaPOST_artefacts/Release/VST3/Kirin Hypha POST.vst3
          if-no-files-found: error

      # B-198: load-validate the built VST3 with Tracktion pluginval (headless). Runs after Upload
      # so the .vst3 artifacts are downloadable even if validation fails. This is the first step
      # that actually instantiates the plugin (the build/Verify steps only prove link + file presence).
      # VST3 bundles are discovered dynamically (not hardcoded) to avoid duplicating the literal
      # artifact path strings: windows-preflight's negative test replaces the POST path in the Upload
      # block and expects the audit to fail, so the path must appear only there. (Note: that audit's
      # section_after scan is unbounded and does NOT itself enforce uniqueness — see windows_preflight.rs.)
      - name: Validate Windows VST3 with pluginval
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Tracktion pluginval v1.0.4 official Windows CLI binary.
          $url = 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip'
          Invoke-WebRequest -Uri $url -OutFile pluginval_Windows.zip
          Expand-Archive -LiteralPath pluginval_Windows.zip -DestinationPath pluginval_bin -Force
          $exe = (Get-ChildItem -Path pluginval_bin -Recurse -Filter pluginval.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw 'pluginval.exe not found in pluginval_Windows.zip' }
          $bundles = @(Get-ChildItem -Path juce_shell/build-windows -Recurse -Directory -Filter *.vst3)
          if ($bundles.Count -ne 2) { throw "expected exactly 2 VST3 bundles, found $($bundles.Count)" }
          foreach ($b in $bundles) {
            Write-Host "pluginval --strictness-level 5 $($b.FullName)"
            # pluginval.exe is a GUI-subsystem app: `& $exe` neither waits for it nor populates
            # $LASTEXITCODE, so the exit code must be read via Start-Process -Wait -PassThru (B-200).
            # The bundle path contains spaces ("Kirin Hypha POST.vst3"); -ArgumentList does not
            # auto-quote, so the path MUST be wrapped in embedded double quotes or it is split (B-201).
            $proc = Start-Process -FilePath $exe -ArgumentList "--strictness-level 5 `"$($b.FullName)`"" -NoNewWindow -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "pluginval failed for $($b.FullName) (exit $($proc.ExitCode))" }
          }
