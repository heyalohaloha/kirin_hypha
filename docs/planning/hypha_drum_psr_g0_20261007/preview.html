<!doctype html><html lang="ja"><meta charset="utf-8"><title>Hypha DRUM / PSR — G0 design</title>
<style>
:root{color-scheme:dark;--bg:#16110d;--panel:#100d0b;--ink:#f0e4cc;--text:#e8e2d8;--post:#e0bd7e;--delta:#7fcfd8;--pre:#d8d0c4}
*{box-sizing:border-box}body{margin:28px;background:#0d0d0e;color:var(--text);font:14px -apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}h1{font-size:22px;font-weight:500;margin:0 0 8px}p{line-height:1.6;max-width:920px}button,select{font:inherit;color:inherit;background:#211c18;border:1px solid #655746;border-radius:3px;padding:5px 9px;cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--delta)}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.lab{color:#b8b1a7;font-size:12px}.stage{display:inline-block;padding:18px;background:#0b0b0b;border:1px solid #28231d}.instrument{position:relative;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:inset 0 1px #4b3e2e;border-radius:5px;font-variant-numeric:tabular-nums}.shell{position:absolute;left:4px;right:4px;top:4px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--post)}.shell b{font-weight:500}.nav{position:absolute;left:4px;right:4px;display:flex;justify-content:space-between;align-items:center;color:var(--text);border-bottom:1px solid #3c3429}.nav .active{color:var(--ink);border-bottom:2px solid var(--post)}.nav span{white-space:nowrap}.time-nav{position:absolute;left:4px;right:4px;display:flex;gap:16px;align-items:center}.time-nav .active{color:var(--post)}.instrument button{font-size:inherit;padding:0 4px;background:transparent;border:0;min-height:14px}.band-controls{display:flex;align-items:center;justify-content:space-between;gap:1px;white-space:nowrap}.band-controls button{padding:0 2px}.band-controls .selected-band{color:var(--post);box-shadow:inset 0 -1px var(--post)}.band-controls #view{color:var(--text);margin-left:4px}.content{position:absolute;overflow:visible}.context{display:flex;align-items:center;justify-content:space-between;white-space:nowrap;gap:4px;color:var(--text)}.context .live{color:var(--delta)}.caption{color:var(--text);white-space:nowrap}.history{position:relative;width:100%;background:#080706;box-shadow:inset 1px 1px #040303,inset 0 2px #4b3d2b;border-top:1px solid #68523a;border-radius:3px;overflow:hidden}.history svg{width:100%;height:100%;display:block}.history .histcap{position:absolute;left:5px;top:1px;line-height:12px;background:#0e0b09e0;z-index:1}.readouts{display:grid;gap:0 4px}.cell{position:relative;box-shadow:inset 0 -1px #31271d;overflow:visible}.metric{color:var(--text);display:flex;justify-content:space-between;align-items:baseline;white-space:nowrap}.scope{color:var(--delta);white-space:nowrap;display:flex;justify-content:space-between;gap:1px}.scope .reason{color:var(--text)}.value{color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;font-weight:500}.reason-only{color:var(--text)}.evidence{position:absolute;background:#17120f;border:1px solid #7c6646;padding:10px;z-index:9;overflow:auto;color:var(--text)}.evidence h2{font-size:inherit;color:var(--post);margin:0 0 7px}.evidence p{margin:6px 0;font-size:inherit;overflow-wrap:anywhere}.evidence button{border:1px solid #5a4a35}.footer{position:absolute;left:8px;right:8px;bottom:5px;display:flex;justify-content:space-between;color:var(--text)}.panes{display:flex;gap:9px}.panes svg{background:#0c0a08;border:1px solid #3d3125;flex:1}.facts{display:grid;gap:3px;color:var(--text)}.facts div{display:flex;justify-content:space-between}.psr-lane{background:#0c0a08;padding:8px 10px;border-top:1px solid #51422e}.psr-read{color:var(--delta);display:flex;gap:15px;align-items:baseline}.psr-read b{font-weight:500;color:var(--ink);font-family:ui-monospace,monospace}.psr-help{color:var(--text);margin-top:5px}.psr-lane svg{width:100%;height:38px}.status{margin:16px 0;font:12px ui-monospace,monospace;max-width:950px;line-height:1.6;white-space:pre-wrap}.warning{color:#e0bd7e}.legend{font-size:12px;margin:12px 0}.compare{display:flex;gap:18px;align-items:flex-start}.help{font-size:12px;max-width:930px}.hidden{display:none}
</style>
<h1>DRUM・PSR / G0 実寸試作</h1><p>合成データによる設計比較です。製品GUI・測定・受入結果ではありません。倍率は実寸、ブラウザーのズーム100%で比較してください。友人による確認は公開後だけで、開発中の工程には含めません。</p>
<div class="controls">
<label>サイズ <select id="size"><option value="0">100% · 300×200</option><option value="1">125% · 375×250</option><option value="2">150% · 450×300</option><option value="3">200% · 600×400</option><option value="4">300% · 900×600</option></select></label>
<label>表示 <select id="surface"><option value="drum">DRUM</option><option value="psr">TIME / PSR</option></select></label>
<label>言語 <select id="lang"><option value="ja">日本語</option><option value="en">English</option></select></label>
<label>条件 <select id="scenario"></select></label>
<label>BAND提示 <select id="cadence"><option>2</option><option selected>4</option><option>8</option></select> Hz</label>
<button id="play">2秒の動的比較</button><button id="gap">欠落を注入</button><button id="snapshot">表示packetを保存</button>
</div><div class="stage"><div id="instrument" class="instrument"></div></div>
<div id="status" class="status"></div><p class="help">DRUM: 一打の選択はhistoryまたは「最新一打」から。historyのクリックは固定3候補の操作模型です。候補はクリックした時点で固定し、←→／HOMEで巡回、ESCで巡回終了、ENDでLIVE。BAND／VIEWは125%以上の操作範囲を維持。この試作の4Hz切替はBANDまとめだけです。TIMEは100ms、ALL／単打は30Hz。</p>
