[package]
name = "kirin_hypha_ffi"
version = "0.1.0"
edition = "2021"

# JUCE 移植 — C ABI ラッパ（RT 計測 / Record / plugin_data IO / PRE-POST ペアリング）。
# kirin_measure を無変更で包む（DSP/計測ロジックは一切 C++ 側へ移さない）。
#
# crate-type:
#   - "staticlib": C/C++ (JUCE) からリンクする本番成果物 (libkirin_hypha_ffi.a)。
#   - "rlib":      §5 の Rust 統合テスト (tests/parity.rs) が本クレートの Rust API を
#                  使うために必要。C 成果物には影響しない。
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
kirin_measure = { workspace = true }
rtrb = { workspace = true }
# instance_id / project_uuid 生成（io_thread_pre 配線 / B-057 3b）。永続は 3c。
uuid = { workspace = true }

[dev-dependencies]
# kirin_measure の MoSQITo tolerance テストと同一の比較マクロ（同許容誤差で assert する）。
approx = "0.5"
# B-057 3b: 書かれた PluginDataFile(.json) を読み戻して schema 検証する。
serde_json = { workspace = true }
