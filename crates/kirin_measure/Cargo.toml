[package]
name = "kirin_measure"
version = "0.1.0"
edition = "2021"

[dependencies]
ebur128 = "0.1"
rtrb = { workspace = true }
log = "0.4"
chrono = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
libc = "0.2"
# guardian_61 C-2: Phase D PSB High FFT 経路（Bark 21-24 + 15.5k-20kHz 補完）。
# ISO 532-1 specific loudness パイプラインとは独立。Measure Thread 上で動作し、
# Audio Thread (R-12 製造境界) には影響しない。
rustfft = "6"
rubato = { version = "2", features = ["fft_resampler"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
] }

[dev-dependencies]
symphonia = { version = "0.5", features = ["wav", "pcm"] }
# G-79-01 (2026-04-24 Daisuke approved): MoSQITo tolerance assertions.
# - sharpness: assert_abs_diff_eq!(epsilon = 0.05 acum)
# - N_spec:    assert_relative_eq!(max_relative = 1e-3)
# - bit-identical: assert_abs_diff_eq!(epsilon = 1e-8)
approx = "0.5"
tempfile = "3"
crc32fast = "=1.5.0"
flate2 = { version = "=1.1.9", default-features = false, features = ["zlib-rs"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
