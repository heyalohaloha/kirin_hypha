[workspace]
members = [
    "crates/hypha_gui",
    "crates/hypha_pre",
    "crates/hypha_post",
    "crates/kirin_measure",
    "crates/kirin_hypha_ffi",
    "xtask",
]
resolver = "2"

[workspace.dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug.git" }
kirin_measure = { path = "crates/kirin_measure" }
hypha_gui = { path = "crates/hypha_gui" }
rtrb = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
open = "5"

# Kirin Hypha fork (2026-04-18): override transitive git deps with vendored forks.
#   - egui-baseview: keyboard-capture gate so space key bubbles up to the DAW
#     (see vendor/egui-baseview/src/window.rs `on_event`).
#   - baseview: nih_log instrumentation on mouseDown/mouseUp and first-responder
#     transitions to diagnose the first-click-ignored bug
#     (see vendor/baseview/src/macos/view.rs).
# Fork tracking policy and upstream commits: fork_maintenance_notes.md.
[patch."https://github.com/RustAudio/baseview.git"]
baseview = { path = "vendor/baseview" }

[patch."https://github.com/BillyDM/egui-baseview.git"]
egui-baseview = { path = "vendor/egui-baseview" }
